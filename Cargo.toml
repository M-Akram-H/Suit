[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/M-Akram-H/Suit"

[workspace.dependencies]
suit-core = { path = "crates/core" }
suit-sig = { path = "crates/sig" }
suit-check = { path = "crates/check" }
suit-codegen = { path = "crates/codegen" }
suit-render = { path = "crates/render" }
suit-engine = { path = "crates/engine" }
suit-ui = { path = "crates/ui" }
suit-export = { path = "crates/export" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
eframe = "0.36"
tiny-skia = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

# Dependencies are compiled once and then left alone, so they can afford full optimisation.
# The canvas needs it: rasterising a full-HD frame is about four times faster.
[profile.dev.package."*"]
opt-level = 3
